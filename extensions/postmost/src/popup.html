<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>PostMost</h1>
  <div id="empty">No listing sent from PostMost yet. Open a listing and click “Send to extension.”</div>

</body>
</html>
