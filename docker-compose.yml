services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postmost
      POSTGRES_PASSWORD: postmost
      POSTGRES_DB: postmost
    ports:
      - "5433:5432"
    volumes:
      - postmost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postmost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postmost-postgres:
